version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: dealer_postgres_db
    restart: always
    environment:
      POSTGRES_USER: materialsuser
      POSTGRES_PASSWORD: materials1234#$
      POSTGRES_DB: dealer_db
    ports:
      # Maps local machine port 5433 to container port 5432
      - "${HOST_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI Web Application Service
  web:
    build: .
    container_name: dealer_fastapi_web
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      # Maps local machine port 8001 to container port 8000
      - "${HOST_WEB_PORT:-8001}:8000"
    environment:
      # Inside Docker network, 'web' must talk to container 'db:5432', so override localhost
      - DATABASE_URL=postgresql+psycopg2://materialsuser:materials1234#$@db:5432/dealer_db
    depends_on:
      - db

volumes:
  postgres_data: